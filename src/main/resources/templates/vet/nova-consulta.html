<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Nova Consulta - PetHub Vet</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fffaee; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .btn-back { color: #d4751e; text-decoration: none; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; color: #b36217; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="datetime-local"], input[type="text"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background-color: #d4751e; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #b36217; }
        .error { color: #d9534f; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Agendar Nova Consulta</h2>
        <a th:href="@{/vet/dashboard}" class="btn-back">&laquo; Voltar</a>
    </div>

    <form th:action="@{/vet/consultas/nova}" th:object="${consultaForm}" method="post">
        
        <div class="form-group">
            <label for="petId">Paciente (Pet) *</label>
            <select id="petId" th:field="*{petId}" required>
                <option value="">-- Selecione o Pet --</option>
                <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.nome + ' (' + pet.especie + ')'}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="dataHora">Data e Hora *</label>
            <input type="datetime-local" id="dataHora" th:field="*{dataHora}" required />
            <div class="error" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></div>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de Consulta *</label>
            <select id="tipo" th:field="*{tipo}" required>
                <option value="">-- Selecione --</option>
                <option th:each="t : ${tiposConsulta}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="motivo">Motivo / Observações</label>
            <input type="text" id="motivo" th:field="*{motivo}" placeholder="Ex: Vacinação, Checkup..." />
        </div>

        <button type="submit" class="btn">Agendar Consulta</button>
    </form>
</div>
</body>
</html>
