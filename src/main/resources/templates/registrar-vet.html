<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Veterinário - PetHub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fffaee; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0c2476; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #081a54; }
        .btn-link { display: block; text-align: center; margin-top: 15px; color: #d4751e; text-decoration: none; }
        .error { color: #d9534f; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Cadastro de Veterinário</h2>
    <form th:action="@{/registrar/vet}" th:object="${vetForm}" method="post">
        
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" th:field="*{nome}" required autofocus />
            <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        
        <div class="form-group">
            <label for="crmv">CRMV</label>
            <input type="text" id="crmv" th:field="*{crmv}" required />
            <div class="error" th:if="${#fields.hasErrors('crmv')}" th:errors="*{crmv}"></div>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" required />
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" required />
            <div class="error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>

        <button type="submit">Cadastrar Veterinário</button>
        <a th:href="@{/login}" class="btn-link">Já tem uma conta? Faça Login</a>
    </form>
</div>
</body>
</html>
