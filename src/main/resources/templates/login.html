<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PetHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffaee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #d4751e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #b36217;
        }
        .error-message, .logout-message {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .logout-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>PetHub Login</h2>

    <div th:if="${param.error}" class="error-message">
        Email ou senha inválidos.
    </div>

    <div th:if="${param.logout}" class="logout-message">
        Você saiu do sistema com sucesso.
    </div>

    <div th:if="${param.registered}" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; text-align: center; margin-bottom: 15px; padding: 10px; border-radius: 4px;">
        Cadastro realizado com sucesso! Você já pode entrar usando o seu e-mail e senha.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Email</label>
            <input type="text" id="username" name="username" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Entrar</button>
        
        <div style="margin-top: 20px; text-align: center;">
            <p>Ainda não tem conta?</p>
            <a th:href="@{/registrar/tutor}" style="color: #d4751e; text-decoration: none; font-weight: bold; margin-right: 15px;">Sou Tutor</a>
            <a th:href="@{/registrar/vet}" style="color: #0c2476; text-decoration: none; font-weight: bold;">Sou Veterinário</a>
        </div>
    </form>
</div>

</body>
</html>
