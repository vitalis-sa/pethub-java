spring.application.name=pethub

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Oracle Datasource
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/orcl}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# Seguranca. O segredo NUNCA vai versionado: vem da variavel de ambiente JWT_SECRET.
pethub.jwt.segredo=${JWT_SECRET}
pethub.jwt.validade=PT8H
