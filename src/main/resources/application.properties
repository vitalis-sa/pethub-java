spring.application.name=pethub

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Oracle Datasource
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/orcl}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
# Todos os horários em America/Sao_Paulo (JSON e banco), qualquer que seja o fuso do servidor.
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Flyway
spring.flyway.enabled=true
# O schema Oracle é compartilhado com o .NET (tabelas de responsável e lembrete). A baseline na
# versão 0 faz o Flyway aceitar essas tabelas e, mesmo assim, aplicar a V1 do Java.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# O Cloud Run termina o HTTPS no proxy e repassa em HTTP com X-Forwarded-Proto. Sem isto, o OpenAPI anuncia
# o servidor como http:// e o navegador bloqueia o "Try it out" do Swagger por conteudo misto.
server.forward-headers-strategy=framework
# Seguranca. O segredo NUNCA vai versionado: vem da variavel de ambiente JWT_SECRET.
pethub.jwt.segredo=${JWT_SECRET}
pethub.jwt.validade=PT8H

# IA (Groq, API compativel com a da OpenAI). A chave NUNCA vai versionada: vem da variavel GROQ_API_KEY.
# O modelo e escolhido por GROQ_MODEL (padrao: openai/gpt-oss-120b).
pethub.ia.groq.api-key=${GROQ_API_KEY:}
pethub.ia.groq.modelo=${GROQ_MODEL:openai/gpt-oss-120b}
pethub.ia.groq.url-base=${GROQ_URL_BASE:https://api.groq.com}
pethub.ia.groq.max-tokens=${GROQ_MAX_TOKENS:8192}
pethub.ia.groq.timeout-segundos=${GROQ_TIMEOUT_SEGUNDOS:30}


# Google Cloud Storage: exames (PDF) em exames/ e fotos de pets em fotos/. O Java so assina URLs.
# Localmente aponte GOOGLE_APPLICATION_CREDENTIALS para o JSON de uma conta de servico; no Cloud Run
# a conta de servico do proprio servico e usada.
# modo=gcs (padrao) usa o bucket; modo=local grava em disco para desenvolver sem conta do Google.
pethub.armazenamento.modo=${ARMAZENAMENTO_MODO:gcs}
pethub.armazenamento.pasta-local=${ARMAZENAMENTO_PASTA:./arquivos-locais}
# URL pela qual o APP alcanca este servico (no celular, o IP da maquina na rede; no emulador Android, http://10.0.2.2:8080).
pethub.armazenamento.url-publica=${ARMAZENAMENTO_URL_PUBLICA:http://localhost:8080}
pethub.armazenamento.segredo-local=${ARMAZENAMENTO_SEGREDO:${JWT_SECRET:}}
pethub.armazenamento.projeto=${GCP_PROJECT_ID:vitalis-pethub}
pethub.armazenamento.bucket=${GCS_BUCKET:vitalis-docs}
pethub.armazenamento.validade-da-url-em-minutos=${GCS_VALIDADE_URL_MIN:15}

# Servico .NET de responsaveis (dono do cadastro de responsaveis e dos lembretes).
pethub.responsaveis.url-base=${RESPONSAVEIS_URL:http://localhost:5192}
pethub.responsaveis.timeout-segundos=10
# Autenticacao entre servicos: JWT HS256 no cabecalho X-Service-Authorization, assinado com este segredo
# (minimo 32 caracteres, o mesmo valor do .NET em ServicoAuth__Segredo). Vazio = sem chamadas de servico.
pethub.servico.segredo=${SERVICE_JWT_SECRET:}

# RabbitMQ (CloudAMQP). O Java so produz; o .NET consome.
# No CloudAMQP use a porta 5671 com RABBIT_SSL=true e o vhost indicado no painel.
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBIT_SSL:false}

# E-mail de confirmacao via Brevo. Sem chave, o envio falha e fica marcado para o reenvio diario.
pethub.email.brevo.api-key=${BREVO_API_KEY:}
pethub.email.brevo.remetente-email=${BREVO_REMETENTE_EMAIL:}
pethub.email.brevo.remetente-nome=${BREVO_REMETENTE_NOME:PetHub}
pethub.email.brevo.url-base=https://api.brevo.com
pethub.email.brevo.timeout-segundos=10
# Reenvio dos e-mails que falharam no dia anterior (segundos minutos horas dia mes dia-da-semana).
pethub.email.reenvio-cron=${EMAIL_REENVIO_CRON:0 0 6 * * *}
